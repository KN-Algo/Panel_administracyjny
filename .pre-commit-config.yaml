repos:
  # Ogólne
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  # Frontend
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^frontend/
        types_or: [javascript, jsx, ts, tsx, json, css, markdown]

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.0.0
    hooks:
      - id: eslint
        files: ^frontend/src/.*\.[jt]sx?$
        types: [file]
        args: [--fix]
        additional_dependencies:
          - eslint@latest
          - typescript@latest
          - "@typescript-eslint/parser@latest"
          - "@typescript-eslint/eslint-plugin@latest"
          - eslint-plugin-react@latest

  - repo: local
    hooks:
      - id: frontend-typecheck
        name: Frontend Typecheck
        entry: npm run typecheck --prefix frontend
        language: system
        pass_filenames: false
        files: ^frontend/src/

# Backend
  - repo: https://gitlab.developers.cam.ac.uk/uis/devops/continuous-delivery/precommit-google-java-format
    rev: v1.2.0
    hooks:
      - id: google-java-format
        files: "\\.java$"
        args: ["-i"]


  # Static Analysis: Checkstyle & PMD
  - repo: https://github.com/gherynos/pre-commit-java
    rev: v0.6.35
    hooks:
      - id: pmd
      - id: cpd
        args: ["--minimum-tokens=50"]
      - id: checkstyle
